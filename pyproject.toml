[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-1b-inference"
version = "0.1.0"
description = "INSIGHTNOVA Nova-1B inference and Hugging Face export"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
authors = [{name = "INSIGHTNOVA"}]
requires-python = ">=3.10"
dependencies = ["torch>=2.8", "transformers==4.57.6", "safetensors>=0.4.5", "huggingface-hub>=0.34,<1"]

[project.optional-dependencies]
flash = [
    "torch>=2.10",
    "ai2-olmo-core[fla] @ git+https://github.com/allenai/OLMo-core.git@92870a33c3fee060d57c3faec52b0b369ece85a6",
    "flash-linear-attention==0.5.2",
    "fla-core==0.5.2",
    "triton==3.7.1; sys_platform == 'linux'",
    # FlashAttention is installed separately with --no-build-isolation.
    "setuptools>=77", "wheel", "packaging", "psutil", "ninja",
]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["nova"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
